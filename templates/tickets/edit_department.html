{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Edit Department
                </h2>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        {{ form.name.label_tag }}

                        {{ form.name }}

                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="{% url 'department_list' %}"
                           class="btn btn-secondary">

                            Back

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Update Department

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
