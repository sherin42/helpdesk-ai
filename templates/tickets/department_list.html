{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4 text-center">
                    Departments
                </h2>

                <!-- ADD DEPARTMENT -->
                <h4 class="mb-3">
                    Add Department
                </h4>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        {{ form.name.label_tag }}

                        {{ form.name }}

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        Add Department

                    </button>

                </form>

                <hr class="my-4">

                <!-- ALL DEPARTMENTS -->
                <h4 class="mb-3">
                    All Departments
                </h4>

                {% for dept in departments %}

                    <div class="card mb-3">

                        <div class="card-body d-flex justify-content-between align-items-center">

                            <h5 class="mb-0">
                                {{ dept.name }}
                            </h5>

                            <div>

                                <a href="{% url 'edit_department' dept.id %}"
                                   class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a href="{% url 'delete_department' dept.id %}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this department?')">

                                    Delete

                                </a>

                            </div>

                        </div>

                    </div>

                {% empty %}

                    <div class="alert alert-secondary">

                        No departments added yet.

                    </div>

                {% endfor %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
