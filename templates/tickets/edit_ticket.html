{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Edit Ticket
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <!-- FORM FIELDS -->
                    <div class="mb-3">
                        <label class="form-label">
                            Title
                        </label>

                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Description
                        </label>

                        {{ form.description }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Priority
                        </label>

                        {{ form.priority }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Department
                        </label>

                        {{ form.department }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        {{ form.status }}
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Assigned To
                        </label>

                        {{ form.assigned_to }}

                    </div>

                    <div class="d-flex justify-content-between">

                        <button type="submit"
                                class="btn btn-primary">

                            Save Changes

                        </button>

                        <a href="{% url 'all_tickets' %}"
                           class="btn btn-secondary">

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
